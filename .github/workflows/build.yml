name: Build AcreetionOS-Plasma ISO

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          # Full upgrade in the same transaction as the deps. A bare -Sy
          # followed by -S is a partial upgrade: it stranded the build the
          # moment Arch moved to OpenSSL 4, whose soname bump broke every
          # installed package linked against libcrypto.so=3 (curl, pacman,
          # cryptsetup...). -Syu moves the whole system together.
          pacman -Syu --noconfirm --needed archlinux-keyring archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell git github-cli openssh rclone
      - uses: actions/checkout@v4
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh 2>&1
      - name: Checksums
        run: |
          for f in ./ISO/*.iso; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AcreetionOS-Plasma
          path: ./ISO/*.iso
          retention-days: 7
      - name: Publish to US server (S3)
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: "https://s3.acreetionos.org"
          S3_BUCKET: "acreetionos-isos"
          EDITION: PLASMA
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then echo "no ISO to publish"; exit 0; fi
          # Publishing history: the SSH mirror route failed three runs in
          # three different ways, so publishing moved to Cloudflare R2
          # (owner's call, 2026-11-13) -- but the R2 bucket was never
          # created and the secrets were never set, so that step failed
          # loud on every run. Owner's call, 2026-11-16: no R2 at all.
          # Publish instead to the self-hosted S3-compatible store
          # (Garage) on the US server: same S3-over-HTTPS shape as R2,
          # none of the SSH failure modes, on our own hardware.
          # Endpoint https://s3.acreetionos.org, bucket acreetionos-isos,
          # key "plasma-ci" (read/write/owner on that bucket only),
          # stored as repo secrets S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
          # Rotate with `garage key` on the server, then update the secrets.
          if [ -z "$S3_ACCESS_KEY_ID" ] || [ -z "$S3_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: S3 secrets are not set on this repo yet."
            echo "On the US server, create or rotate the plasma-ci Garage"
            echo "key for bucket $S3_BUCKET, then add its access key and"
            echo "secret key as repo secrets named S3_ACCESS_KEY_ID and"
            echo "S3_SECRET_ACCESS_KEY."
            exit 1
          fi
          BASE="$(basename "$ISO" .iso)"
          DATED="${BASE}-$(date +%Y%m%d).iso"
          LATEST="AcreetionOS-${EDITION}-latest.iso"
          export RCLONE_CONFIG_S3_TYPE=s3
          export RCLONE_CONFIG_S3_PROVIDER=Other
          export RCLONE_CONFIG_S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
          export RCLONE_CONFIG_S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_S3_ENDPOINT="$S3_ENDPOINT"
          export RCLONE_CONFIG_S3_REGION=garage
          export RCLONE_CONFIG_S3_FORCE_PATH_STYLE=true
          rclone copyto "$ISO" "s3:${S3_BUCKET}/${DATED}" --progress --s3-chunk-size 64M
          rclone copyto "s3:${S3_BUCKET}/${DATED}" "s3:${S3_BUCKET}/${LATEST}"
          ( cd ./ISO && sha256sum "$(basename "$ISO")" ) > SHA256SUMS.txt
          rclone copyto SHA256SUMS.txt "s3:${S3_BUCKET}/SHA256SUMS.txt"
          echo "Published ${DATED} (+ ${LATEST} alias) to US-server S3 bucket ${S3_BUCKET}"

      - name: Publish Release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then
            echo "no ISO to publish"
            exit 0
          fi
          TAG="build-${{ github.run_number }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # GitHub release assets cap at 2GiB — xz-compress if needed
            if [ "$(stat -c%s "$ISO")" -ge 2147483648 ]; then
              echo "ISO over 2GiB — compressing for release"
              xz -k -f -9 "$ISO" && ISO="$ISO.xz"
            fi
            if [ "$(stat -c%s "$ISO")" -lt 2147483648 ]; then
              gh release create "$TAG" "$ISO" --repo "${{ github.repository }}"                 --title "build #${{ github.run_number }}"                 --notes "Automated CI build. Commit ${{ github.sha }}."
            else
              echo "ISO still over 2GiB after xz -9 — skipping release asset (artifact remains in CI)"
            fi
          else
            gh release upload "$TAG" "$ISO" --repo "${{ github.repository }}" --clobber
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
