name: Build AcreetionOS-Plasma ISO

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          # Full upgrade in the same transaction as the deps. A bare -Sy
          # followed by -S is a partial upgrade: it stranded the build the
          # moment Arch moved to OpenSSL 4, whose soname bump broke every
          # installed package linked against libcrypto.so=3 (curl, pacman,
          # cryptsetup...). -Syu moves the whole system together.
          pacman -Syu --noconfirm --needed archlinux-keyring archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell git github-cli openssh rclone
      - uses: actions/checkout@v4
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh 2>&1
      - name: Checksums
        run: |
          for f in ./ISO/*.iso; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AcreetionOS-Plasma
          path: ./ISO/*.iso
          retention-days: 7
      - name: Publish to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: "86a77a981dd5e5a634330a4819aaa2e0"
          R2_BUCKET: "acreetionos-isos"
          EDITION: PLASMA
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then echo "no ISO to publish"; exit 0; fi
          # Publishing moved off the SSH mirror (owner's call, 2026-11-13):
          # that route failed three different ways in three runs -- scan
          # silence, host-key mismatch, and connection closed mid-flight
          # even with 4 collected keys. R2 over HTTPS has none of those
          # failure modes. Needs two repo secrets, created from an R2
          # API token in the Cloudflare dashboard: R2_ACCESS_KEY_ID and
          # R2_SECRET_ACCESS_KEY. Until they exist this step fails LOUD
          # on purpose -- a green run that published nothing is how the
          # old release step lied for months.
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: R2 secrets are not set on this repo yet."
            echo "Cloudflare dashboard -> R2 -> Manage API tokens -> create"
            echo "an Object Read & Write token for bucket $R2_BUCKET, then"
            echo "add its Access Key ID / Secret Access Key as repo secrets"
            echo "named R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          BASE="$(basename "$ISO" .iso)"
          DATED="${BASE}-$(date +%Y%m%d).iso"
          LATEST="AcreetionOS-${EDITION}-latest.iso"
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          rclone copyto "$ISO" "r2:${R2_BUCKET}/${DATED}" --progress --s3-chunk-size 64M
          rclone copyto "r2:${R2_BUCKET}/${DATED}" "r2:${R2_BUCKET}/${LATEST}"
          ( cd ./ISO && sha256sum "$(basename "$ISO")" ) > SHA256SUMS.txt
          rclone copyto SHA256SUMS.txt "r2:${R2_BUCKET}/SHA256SUMS.txt"
          echo "Published ${DATED} (+ ${LATEST} alias) to R2 bucket ${R2_BUCKET}"

      - name: Publish Release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then
            echo "no ISO to publish"
            exit 0
          fi
          TAG="build-${{ github.run_number }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # GitHub release assets cap at 2GiB — xz-compress if needed
            if [ "$(stat -c%s "$ISO")" -ge 2147483648 ]; then
              echo "ISO over 2GiB — compressing for release"
              xz -k -f -9 "$ISO" && ISO="$ISO.xz"
            fi
            if [ "$(stat -c%s "$ISO")" -lt 2147483648 ]; then
              gh release create "$TAG" "$ISO" --repo "${{ github.repository }}"                 --title "build #${{ github.run_number }}"                 --notes "Automated CI build. Commit ${{ github.sha }}."
            else
              echo "ISO still over 2GiB after xz -9 — skipping release asset (artifact remains in CI)"
            fi
          else
            gh release upload "$TAG" "$ISO" --repo "${{ github.repository }}" --clobber
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
